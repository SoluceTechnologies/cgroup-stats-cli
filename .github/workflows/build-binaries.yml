name: Build release binaries

on:
  workflow_call:
    inputs:
      version:
        description: "Version being released (e.g. 1.3.0)"
        required: true
        type: string
      ref:
        description: "Release identifier (draft tag) to upload assets to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: macOS ${{ matrix.target }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Resolve binary name
        run: |
          BIN_NAME=$(cargo metadata --no-deps --format-version 1 \
            | jq -r 'first(.packages[0].targets[] | select(.kind[] == "bin") | .name)')
          test -n "$BIN_NAME" || { echo "no [[bin]] target in Cargo.toml"; exit 1; }
          echo "BIN_NAME=$BIN_NAME" >> "$GITHUB_ENV"
          echo "Resolved binary name: $BIN_NAME"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          BIN="target/${{ matrix.target }}/release/$BIN_NAME"
          strip "$BIN" || true
          NAME="$BIN_NAME-${{ inputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "$BIN" "dist/$NAME/$BIN_NAME"
          cp README.md LICENSE "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          shasum -a 256 "dist/$NAME.tar.gz" | awk '{print $1}' > "dist/$NAME.tar.gz.sha256"
          echo "TARBALL=dist/$NAME.tar.gz" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.ref }}" \
            "$TARBALL" \
            "$TARBALL.sha256" \
            --clobber

  linux:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            deb_arch: amd64
          - target: aarch64-unknown-linux-gnu
            deb_arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Resolve binary name
        run: |
          BIN_NAME=$(cargo metadata --no-deps --format-version 1 \
            | jq -r 'first(.packages[0].targets[] | select(.kind[] == "bin") | .name)')
          test -n "$BIN_NAME" || { echo "no [[bin]] target in Cargo.toml"; exit 1; }
          echo "BIN_NAME=$BIN_NAME" >> "$GITHUB_ENV"
          echo "Resolved binary name: $BIN_NAME"

      - name: Install zig + cargo tools
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
          cargo install cargo-deb --locked

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          BIN="target/${{ matrix.target }}/release/$BIN_NAME"
          NAME="$BIN_NAME-${{ inputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "$BIN" "dist/$NAME/$BIN_NAME"
          cp README.md LICENSE "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          sha256sum "dist/$NAME.tar.gz" | awk '{print $1}' > "dist/$NAME.tar.gz.sha256"
          echo "TARBALL=dist/$NAME.tar.gz" >> "$GITHUB_ENV"

      - name: Build .deb
        run: |
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output dist/
          ls -1 dist/*.deb

      - name: Smoke test binary
        run: |
          if [ "${{ matrix.deb_arch }}" = "amd64" ]; then
            "./target/${{ matrix.target }}/release/$BIN_NAME" --version
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.ref }}" \
            "$TARBALL" \
            "$TARBALL.sha256" \
            dist/*_${{ matrix.deb_arch }}.deb \
            --clobber
