[package]
name = "cgroup_stats_cli"
version = "1.0.0"
edition = "2024"
description = """A Command Line Interface to manage cgroups"""
authors = ["Charles Gauthereau <charles.gauthereau@soluce-technologies.com>", "Killian Larcher <charles.gauthereau@soluce-technologies.com>"]
license = "Apache-2.0"
keywords = ["cgroups", "cli", "linux"]
categories = ["command-line-utilities"]
readme = "README.md"
repository = "https://github.com/SoluceTechnologies/cgroup-stats-cli.git"
homepage = "https://github.com/SoluceTechnologies/cgroup-stats-cli"

[[bin]]
name = "cgroup-stats-cli"
path = "src/main.rs"

[lib]
name = "cgroup_stats_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }

[profile.release]
strip = true

[package.metadata.deb]
maintainer = "Charles Gauthereau <charles.gauthereau@soluce-technologies.com>"
copyright = "2026, Soluce Technologies"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "libc6"
extended-description = "A Command Line Interface to manage cgroups."
